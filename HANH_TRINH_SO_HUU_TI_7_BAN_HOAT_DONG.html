{q:'Một bạn đi được 3/4 km, sau đó đi thêm 1/2 km. Tổng quãng đường là?',a:['1/4 km','5/4 km','4/6 km','3/8 km'],c:1,e:'3/4 + 1/2 = 3/4 + 2/4 = 5/4 km = 1,25 km.'},
{q:'Bình có 120.000đ, dùng 1/4 số tiền để mua vở. Bình đã dùng bao nhiêu?',a:['40.000đ','30.000đ','90.000đ','20.000đ'],c:1,e:'120.000 × 1/4 = 30.000 đồng.'},
{q:'Một bể chứa 3/5 dung tích, được đổ thêm 1/4 dung tích bể. Phần bể có nước là?',a:['4/9','17/20','3/20','1'],c:1,e:'3/5 + 1/4 = 12/20 + 5/20 = 17/20 dung tích bể.'},
{q:'Một thợ lặn đang ở độ sâu −4,5 m, rồi nổi lên 2 m. Vị trí mới là?',a:['−6,5 m','6,5 m','−2,5 m','2,5 m'],c:2,e:'−4,5 + 2 = −2,5 m, vẫn nằm dưới mặt nước.'},
{q:'Một cuộn ruy băng dài 2,5 m, cắt thành 5 đoạn bằng nhau. Mỗi đoạn dài?',a:['0,5 m','1/2 cm','12,5 m','2 m'],c:0,e:'2,5 : 5 = 0,5 m.'}
]}
];
const STORE='vuongquoc_sohuuti_v5',HISTORY='vuongquoc_sohuuti_history_v5';
let state=null,screen='start',feedback=null,missed=[],retrying=false;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY)||'[]')}catch(e){return []}}
function saveHistory(row){try{const h=getHistory();h.push(row);localStorage.setItem(HISTORY,JSON.stringify(h.slice(-100)))}catch(e){}}
function init(){const s=load();if(s&&s.name&&Array.isArray(s.records)&&s.records.length===5){state=s;screen=state.finished?'report':'map'}render()}
function fresh(name,klass){state={name:name.trim(),klass:klass.trim(),records:levels.map(l=>({attempts:0,first:0,done:0,wrong:0,finished:false,stars:0,points:0,mistakes:{}})),current:0,qi:0,errors:0,firstTry:true,finished:false,started:new Date().toISOString()};feedback=null;missed=[];save();screen='map';render()}
function summary(){if(!state||!Array.isArray(state.records))return {points:0,stars:0,done:0};return {points:state.records.reduce((a,r)=>a+r.points,0),stars:state.records.reduce((a,r)=>a+r.stars,0),done:state.records.reduce((a,r)=>a+r.done,0)}}
function topbar(){const s=summary();return `<header class="topbar"><div class="brand"><span class="brand-icon">✦</span><span>HÀNH TRÌNH <span style="color:#7459dd">SỐ HỮU TỈ</span></span></div><div class="top-actions">${state?`<span class="chip" title="Người chơi">👤 ${esc(state.name)} · ${esc(state.klass)}</span><span class="chip">⭐ <strong>${s.stars}</strong></span><span class="chip">💎 <strong>${s.points}</strong></span>`:''}<button class="smallbtn" onclick="goHome()">${state?'🗺️ Bản đồ':'🏠 Trang đầu'}</button></div></header>`}
function render(){let html=topbar();if(screen==='start')html+=startPage();else if(screen==='map')html+=mapPage();else if(screen==='game')html+=gamePage();else if(screen==='levelend')html+=levelEndPage();else if(screen==='report')html+=reportPage();$('#app').innerHTML=`<main class="shell">${html}<div class="footer">🌈 Phiêu lưu bằng trí tuệ · Không chiến đấu · Không quảng cáo · Chơi trực tiếp trên trình duyệt</div></main>`}
function startPage(){return `<section class="start-layout"><div><div class="eyebrow">🎮 Game toán học lớp 7</div><h1 class="h1">Khám phá <span class="purple">5 vương quốc</span><br> Số Hữu Tỉ!</h1><p class="desc">Giải thử thách, mở khóa vùng đất mới và thu thập những ngôi sao tri thức. Sai cũng không sao — học mẹo và thử lại nhé!</p><div class="start-sub"><span class="mini">🏝️ 5 vương quốc</span><span class="mini">🧩 30 câu hỏi</span><span class="mini">⭐ Thành tích cá nhân</span><span class="mini">📊 Báo cáo cuối game</span></div><form class="card login" onsubmit="startGame(event); return false"><label for="name">Tên nhà thám hiểm</label><input id="name" maxlength="50" placeholder="Ví dụ: Nguyễn Minh Anh" required autocomplete="name"><label for="klass">Lớp của em</label><input id="klass" maxlength="30" placeholder="Ví dụ: 7A1" required><button class="btn primary" type="submit">BẮT ĐẦU CHƠI NGAY ✨</button><p class="tiny">Tên và lớp giúp ghi nhận kết quả trên thiết bị này. Em không cần tạo tài khoản.</p></form></div><div class="heroart"><div class="world">🏰</div><div class="float f1">⭐ +10 điểm</div><div class="float f2">🌈 Chinh phục Toán 7</div></div></section>`}
function mapPage(){const total=summary();const available=state.records.findIndex(r=>!r.finished);let html=`<div class="section-head"><div><div class="eyebrow">🗺️ Bản đồ phiêu lưu</div><h1>Chọn vương quốc của em</h1><p class="desc" style="margin:5px 0">Chào <b>${esc(state.name)}</b>! Hoàn thành mỗi vương quốc để mở vùng đất tiếp theo.</p></div><div class="mapinfo"><div class="small"><span>Đã vượt qua</span><span>${total.done}/30 thử thách</span></div><div class="progress-wrap"><div class="progress-fill" style="width:${total.done/30*100}%"></div></div></div></div><div class="kingdoms">`;
levels.forEach((l,i)=>{const r=state.records[i],locked=i>0&&!state.records[i-1].finished;html+=`<button class="kingdom" ${locked?'disabled':''} onclick="enterLevel(${i})"><div class="kingdom-header" style="background:${l.color}">${l.emoji}</div><div class="kingdom-body"><div class="kingdom-level">VƯƠNG QUỐC ${i+1} / 5</div><h3>${l.title}</h3><p>${l.desc}</p><div class="kingdom-footer"><span>${locked?'🔒 Chưa mở':r.finished?'✅ Đã chinh phục':'▶ Khám phá ngay'}</span><span class="stars">${r.finished?'★'.repeat(r.stars)+'☆'.repeat(3-r.stars):'☆☆☆'}</span></div></div></button>`});html+='</div><div class="world-note">💡 <b>Luật chơi:</b> Mỗi câu đúng ngay lần đầu được 10 điểm, đúng sau khi thử lại được 5 điểm. Có thể làm lại khi sai; ngôi sao được tính theo số câu đúng ngay lần đầu. Hoàn thành một vùng đất để mở khóa vùng đất kế tiếp.</div>';if(state.finished)html+='<button class="btn primary" onclick="showReport()">📊 Xem báo cáo chuyến đi</button>';return html}
function enterLevel(i){if(i>0&&!state.records[i-1].finished)return;state.current=i;const r=state.records[i];if(r.finished){screen='levelend';feedback=null;render();return;}state.qi=r.done;state.errors=0;state.firstTry=!(r.mistakes&&r.mistakes[state.qi]);feedback=null;missed=[];screen='game';save();render()}
function gamePage(){let l=levels[state.current],r=state.records[state.current],q=l.qs[state.qi];if(!q){screen='levelend';return levelEndPage()}let pct=((state.current*6+state.qi)/30)*100;let opts=q.t==='line'?lineHTML():`<div class="options">${q.a.map((a,i)=>`<button class="option ${feedback&&missed.includes(i)?'wrong':''} ${feedback&&feedback.ok?'disabled':''}" onclick="choose(${i})"><span class="key">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span></button>`).join('')}</div>`;
return `<div class="game-top"><div class="game-title"><div class="icon">${l.emoji}</div><div><h1>${l.title}</h1><p>Vương quốc ${state.current+1}/5 · Chinh phục bằng trí tuệ</p></div></div><button class="smallbtn" onclick="goHome()">🗺️ Về bản đồ</button></div><div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div><div class="card game-card"><div class="question-label"><span>THỬ THÁCH ${state.qi+1} / ${l.qs.length}</span><span>${state.firstTry?'✨ Cơ hội +10 điểm':'💪 Cố lên! +5 điểm'}</span></div><h2 class="question">${esc(q.q)}</h2>${opts}<div id="feedback" aria-live="polite">${feedbackHTML()}</div></div>`}
function lineHTML(){let points=[];for(let v=-2;v<=2.001;v+=.5)points.push(Number(v.toFixed(1)));return `<div class="numberline"><div class="num-hint">👇 Chạm vào chấm tròn tại vị trí em chọn</div><div class="num-row">${points.map(v=>{const bad=missed.includes(v),good=feedback&&feedback.ok&&feedback.value===v;return `<button class="num-point ${bad?'wrong':good?'correct':''}" ${feedback&&feedback.ok?'disabled':''}" onclick="choose(${v})" aria-label="Chọn ${v}"><span class="num-dot">${good?'✓':bad?'×':''}</span><span class="num-label">${v.toString().replace('.',',')}</span></button>`}).join('')}</div><div class="explainline">Mỗi khoảng cách giữa hai chấm = 1/2 đơn vị</div></div>`}
function feedbackHTML(){if(!feedback)return '';let ok=feedback.ok;return `<div class="feedback ${ok?'ok':''}" role="status"><strong>${ok?'🎉 Chính xác! Tuyệt lắm!':'💡 Chưa đúng, thử lại nhé!'}</strong><p>${esc(feedback.message)}</p><button class="btn ${ok?'successbtn':'secondary'}" onclick="${ok?'nextQuestion()':'tryAgain()'}">${ok?'TIẾP TỤC ➜':'🔄 THỬ LẠI'}</button></div>`}
function choose(i){if(feedback)return;const l=levels[state.current],q=l.qs[state.qi],r=state.records[state.current],ok=q.t==='line'?i===q.v:i===q.c;r.attempts++;if(ok){r.done++;if(state.firstTry){r.first++;r.points+=10}else r.points+=5;feedback={ok:true,value:i,message:q.e};}else{r.wrong++;r.mistakes=r.mistakes||{};r.mistakes[state.qi]=true;state.firstTry=false;missed.push(i);feedback={ok:false,value:i,message:q.e};}save();render()}
function tryAgain(){feedback=null;render()}
function nextQuestion(){if(!feedback||!feedback.ok)return;const l=levels[state.current],r=state.records[state.current];state.qi++;state.firstTry=!(r.mistakes&&r.mistakes[state.qi]);state.errors=0;feedback=null;missed=[];if(state.qi>=l.qs.length){r.finished=true;r.stars=r.first===6?3:r.first>=4?2:r.first>=2?1:0;screen='levelend'}save();render();window.scrollTo(0,0)}
function levelEndPage(){const l=levels[state.current],r=state.records[state.current],last=state.current===4;return `<section class="card levelend"><div class="bigemoji">${r.stars>=2?'🏆':'🎉'}</div><div class="eyebrow">CHINH PHỤC THÀNH CÔNG</div><h2>${esc(l.title)}</h2><div class="stars" style="font-size:37px">${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</div><p>${r.stars===3?'Xuất sắc! Em trả lời chính xác tất cả ngay lần đầu.':r.stars>=2?'Rất tốt! Em đang tiến bộ rõ rệt.':'Em đã kiên trì vượt qua thử thách. Cùng ôn lại để đạt nhiều sao hơn nhé!'}</p><div class="result-cards"><div class="metric"><strong>${r.points}</strong><span>💎 Điểm vùng đất</span></div><div class="metric"><strong>${r.first}/6</strong><span>✅ Đúng lần đầu</span></div><div class="metric"><strong>${r.wrong}</strong><span>🔁 Lượt trả lời sai</span></div></div><div class="result-actions"><button class="btn secondary" onclick="goHome()">🗺️ Bản đồ</button><button class="btn primary" onclick="${last?'finishGame()':'enterLevel('+(state.current+1)+')'}">${last?'XEM TỔNG KẾT 📊':'VƯƠNG QUỐC TIẾP THEO ➜'}</button></div></section>`}
function finishGame(){state.finished=true;save();saveHistory({name:state.name,klass:state.klass,date:new Date().toISOString(),...summary(),skills:state.records.map(r=>r.first+'/6').join(' | ')});screen='report';render()}
function showReport(){screen='report';render()}
function reportPage(){const s=summary(),good=levels.filter((l,i)=>state.records[i].first>=4),need=levels.filter((l,i)=>state.records[i].first<4);return `<div class="report"><section class="report-hero"><div class="bigemoji">🌟</div><div class="eyebrow">BẢNG THÀNH TÍCH CUỐI HÀNH TRÌNH</div><h1>Chúc mừng ${esc(state.name)}!</h1><p>Lớp ${esc(state.klass)} · Hoàn thành 5 vương quốc và 30 thử thách</p><div class="result-cards"><div class="metric"><strong>${s.points}</strong><span>💎 Tổng điểm</span></div><div class="metric"><strong>${s.stars}/15</strong><span>⭐ Ngôi sao</span></div><div class="metric"><strong>${state.records.reduce((a,r)=>a+r.first,0)}/30</strong><span>✅ Đúng ngay lần đầu</span></div></div></section><div class="report-grid"><div class="card report-panel"><h3>📊 Thành tích 5 kỹ năng</h3>${levels.map((l,i)=>{const r=state.records[i],n=Math.round(r.first/6*100);return `<div class="skill-row"><div class="skill-row-head"><span>${l.emoji} ${l.short}</span><span class="${n>=67?'good':'review'}">${r.first}/6 · ${n}%</span></div><div class="progress-wrap"><div class="progress-fill" style="width:${n}%;${n<67?'background:linear-gradient(90deg,#ffc56f,#ff9e6d)':''}"></div></div><small>Đúng ngay lần đầu · ${r.wrong} lượt sai</small></div>`}).join('')}</div><div class="card report-panel"><h3>🎯 Nhận xét riêng cho em</h3><p style="color:#2e9f7b;font-weight:900">✅ Nội dung làm tốt</p>${good.length?good.map(l=>`<div class="suggestion" style="border-color:#44cda4;background:#eafff6">${l.emoji} <b>${l.short}</b> — em đã nắm khá chắc kiến thức!</div>`).join(''):'<p style="font-size:14px;color:#756f8b">Em hãy luyện thêm để có kỹ năng đạt ít nhất 4/6 câu đúng ngay lần đầu.</p>'}<p style="color:#cb792e;font-weight:900;margin-top:22px">📚 Nội dung cần luyện thêm</p>${need.length?need.map(l=>`<div class="suggestion">${l.emoji} <b>${l.short}</b> — ${reviewTip(l.id)}</div>`).join(''):'<div class="suggestion" style="border-color:#44cda4;background:#eafff6">Tuyệt vời! Không có kỹ năng nào dưới mức 4/6 câu đúng ngay lần đầu.</div>'}</div></div><div class="result-actions" style="margin-top:25px"><button class="btn primary" onclick="exportCSV()">📄 TẢI BÁO CÁO CSV</button><button class="btn secondary" onclick="goHome()">🗺️ Xem bản đồ</button><button class="btn secondary" onclick="restart()">🔄 Chơi hành trình mới</button></div><p class="history">📌 Kết quả đang được lưu trên trình duyệt của thiết bị này. Để giáo viên thu được kết quả, học sinh cần tải file CSV và gửi cho thầy/cô. Game không tự gửi điểm lên hệ thống chung.</p></div>`}
function reviewTip(id){return ({nhanbiet:'Ôn định nghĩa a/b (b ≠ 0), số đối và số thập phân.',trucso:'Ôn chiều dương, chiều âm và cách chia khoảng đơn vị.',sosanh:'Quy đồng hoặc đổi sang thập phân trước khi so sánh.',pheptinh:'Luyện quy đồng, dấu của phép tính và quy tắc chia phân số.',thucte:'Tóm tắt đề, xác định phép tính rồi kiểm tra đơn vị.'})[id]}
function exportCSV(){const headers=['Họ tên','Lớp','Ngày hoàn thành','Tổng điểm','Tổng sao',...levels.flatMap(l=>[l.short+' đúng lần đầu',l.short+' lượt sai',l.short+' sao'])];const vals=[state.name,state.klass,new Date().toLocaleString('vi-VN'),summary().points,summary().stars,...state.records.flatMap(r=>[r.first,r.wrong,r.stars])];let row=a=>a.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',');const csv='\uFEFF'+row(headers)+'\r\n'+row(vals)+'\r\n',blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Bao_cao_So_huu_ti_'+state.klass.replace(/[^\p{L}\p{N}-]/gu,'_')+'_'+state.name.replace(/[^\p{L}\p{N}-]/gu,'_')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function goHome(){screen=state?'map':'start';feedback=null;missed=[];render()}
function startGame(e){if(e)e.preventDefault();const name=$('#name')?.value||'',klass=$('#klass')?.value||'';if(name.trim()&&klass.trim()){fresh(name,klass)}else{alert('Em hãy nhập họ tên và lớp trước khi bắt đầu nhé!')}}
function restart(){if(confirm('Bắt đầu hành trình mới? Thành tích hiện tại sẽ được thay thế trên màn chơi này.')){let n=state.name,c=state.klass;fresh(n,c)}}
init();
</script></body></html>
